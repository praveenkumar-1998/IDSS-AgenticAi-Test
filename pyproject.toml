[project]
name = "idss-test-workspace"
version = "0.1.0"
description = "Monorepo workspace for IDSS microservices (Customer, Product, Order) with shared library"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[tool.uv.workspace]
members = [
    "shared",
    "services/customer_service",
    "services/product_service",
    "services/order_service",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
